# New-API Docker Compose Configuration
#
# Quick Start:
#   1. docker-compose up -d
#   2. Run once on host: tailscale serve --bg --https=3019 / http://localhost:3019
#   3. Access via Tailscale HTTPS at https://<hostname>.<tailnet>.ts.net
#
# Using MySQL instead of PostgreSQL:
#   1. Comment out the postgres service and SQL_DSN line
#   2. Uncomment the mysql service and SQL_DSN line
#   3. Uncomment mysql in depends_on
#   4. Uncomment mysql_data in volumes section

version: '3.4'

services:
  new-api:
    image: calciumion/new-api:latest
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "127.0.0.1:${APP_PORT}:3000"  # localhost-only; external access via Tailscale HTTPS
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://root:${POSTGRES_PASSWORD}@postgres:5432/new-api
#      - SQL_DSN=root:${MYSQL_PASSWORD}@tcp(mysql:3306)/new-api
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD}@redis:6379
      - TZ=${TZ}
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=${NODE_NAME}
#      - STREAMING_TIMEOUT=300
#      - SESSION_SECRET=random_string
#      - SYNC_FREQUENCY=60
#      - GOOGLE_ANALYTICS_ID=G-XXXXXXXXXX
#      - UMAMI_WEBSITE_ID=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
#      - UMAMI_SCRIPT_URL=https://analytics.umami.is/script.js
    depends_on:
      - redis
      - postgres
#      - mysql
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - new-api-network

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - new-api-network
#    ports:
#      - "5432:5432"

  auth2api:
    build: ./auth2api
    container_name: auth2api
    restart: always
    volumes:
      - auth2api_data:/data
      - ./auth2api/config.tmpl.yaml:/config/config.tmpl.yaml:ro
    environment:
      - AUTH2API_KEY=${AUTH2API_KEY}
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8317/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  channel-init:
    image: alpine:3.19
    container_name: channel-init
    restart: "no"
    command: sh -c "apk add -q --no-cache curl jq && sh /init-channels.sh"
    environment:
      - NEW_API_URL=http://new-api:3000
      - NEW_API_ADMIN_PASSWORD=${NEW_API_ADMIN_PASSWORD:-123456}
      - AUTH2API_KEY=${AUTH2API_KEY}
      - AUTH2API_URL=http://auth2api:8317
    volumes:
      - ./scripts/init-channels.sh:/init-channels.sh:ro
    depends_on:
      new-api:
        condition: service_healthy
    networks:
      - new-api-network

#  mysql:
#    image: mysql:8.2
#    container_name: mysql
#    restart: always
#    environment:
#      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
#      MYSQL_DATABASE: new-api
#    volumes:
#      - mysql_data:/var/lib/mysql
#    networks:
#      - new-api-network
#    ports:
#      - "3306:3306"

volumes:
  pg_data:
  auth2api_data:
#  mysql_data:

networks:
  new-api-network:
    driver: bridge
